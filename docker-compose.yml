services:
  lepulse:
    image: ramirokaffo/lepulse:${IMAGE_TAG:-latest}
    container_name: lepulse
    restart: unless-stopped
    init: true
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Définissez DJANGO_SECRET_KEY dans .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-},127.0.0.1,localhost
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_SERVE_FILES: "1"
      DJANGO_STATIC_MANIFEST: "1"
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-0}
      DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-0}
      DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-0}
      DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: ${DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS:-0}
      DJANGO_SECURE_HSTS_PRELOAD: ${DJANGO_SECURE_HSTS_PRELOAD:-0}
      SITE_URL: ${SITE_URL:?Définissez SITE_URL dans .env}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:?Définissez EMAIL_HOST dans .env}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:?Définissez EMAIL_HOST_USER dans .env}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:?Définissez EMAIL_HOST_PASSWORD dans .env}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?Définissez DEFAULT_FROM_EMAIL dans .env}
      SQLITE_PATH: /data/db.sqlite3
      MEDIA_ROOT: /app/media
      STATIC_ROOT: /app/staticfiles
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - lepulse_data:/data
      - lepulse_media:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; request = urllib.request.Request('http://127.0.0.1:8000/', headers={'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(request, timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  lepulse_data:
  lepulse_media: